<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semua Tempat Servis — RepairConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
      body {
        font-family: "Inter", system-ui, sans-serif;
      }
      .rc-field {
        width: 100%;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 0.75rem;
        padding: 0.625rem 0.75rem;
        font-size: 0.75rem;
        outline: none;
      }
      .rc-field:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
      }
      #map {
        height: 100%;
        min-height: 320px;
        border-radius: 1rem;
        z-index: 0;
      }
      .shop-card.active {
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.25);
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3"
      >
        <a
          href="index.html"
          class="flex items-center gap-2 text-xs font-semibold text-slate-600 hover:text-blue-600"
        >
          <i class="fa-solid fa-arrow-left"></i> Kembali ke Dashboard
        </a>
        <div class="flex items-center gap-2.5">
          <div
            class="bg-blue-600 text-white w-9 h-9 rounded-2xl flex items-center justify-center font-extrabold text-sm"
          >
            RC
          </div>
          <span
            class="font-extrabold text-sm tracking-tight text-slate-900 hidden sm:inline"
            >RepairConnect</span
          >
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-5">
      <div>
        <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900">
          Semua Tempat Servis
        </h1>
        <p id="locInfo" class="text-xs text-slate-500 mt-1">
          Mencari lokasimu...
        </p>
      </div>

      <!-- Filter -->
      <div
        class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-4 space-y-3"
      >
        <div class="flex flex-col md:flex-row gap-3 md:items-center">
          <div
            class="inline-flex bg-slate-100 rounded-xl p-1 text-xs font-semibold self-start"
          >
            <button
              id="catLaptop"
              onclick="setCat('laptop')"
              class="px-4 py-2 rounded-lg"
            >
              Laptop
            </button>
            <button
              id="catPhone"
              onclick="setCat('phone')"
              class="px-4 py-2 rounded-lg"
            >
              HP &amp; Tablet
            </button>
          </div>
          <select
            id="radiusSel"
            onchange="setRadius(this.value)"
            class="rc-field md:w-40"
          >
            <option value="5">Radius 5 km</option>
            <option value="8" selected>Radius maksimal 8 km</option>
          </select>
          <div class="relative flex-1">
            <i
              class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"
            ></i>
            <input
              type="search"
              id="q"
              oninput="resetAndRender()"
              placeholder="Cari nama toko servis..."
              class="rc-field pl-9"
            />
          </div>
          <button
            onclick="locateMe()"
            class="shrink-0 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 text-xs font-semibold px-3.5 py-2.5 rounded-xl flex items-center justify-center gap-1.5"
          >
            <i class="fa-solid fa-location-crosshairs text-blue-600"></i>
            Gunakan lokasi saya
          </button>
        </div>
      </div>

      <div class="grid lg:grid-cols-5 gap-5">
        <!-- Daftar -->
        <section class="lg:col-span-2 order-2 lg:order-1 space-y-3">
          <p id="countInfo" class="text-xs font-semibold text-slate-500"></p>
          <div id="list" class="space-y-3"></div>
          <div id="moreBox" class="text-center"></div>
        </section>

        <!-- Peta -->
        <section class="lg:col-span-3 order-1 lg:order-2">
          <div
            class="lg:sticky lg:top-24 h-[340px] lg:h-[calc(100vh-8rem)] bg-white rounded-2xl border border-slate-200 p-1.5 shadow-sm"
          >
            <div id="map"></div>
          </div>
        </section>
      </div>
    </main>

    <script src="tempat-servis.js"></script>
  </body>
</html>
